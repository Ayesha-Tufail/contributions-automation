name: Streak Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update streak log
        run: echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Bot kept streak alive" >> streak.log
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto streak commit"
          commit_user_name: "Ayesha-Tufail"
          commit_user_email: "ayeshatufail7621@gmail.com"
          commit_author: "Ayesha-Tufail <ayeshatufail7621@gmail.com>"